name: Build Aether Runtime Center APK

on:
  pull_request:
    paths:
      - 'projects/aether-runtime-center/**'
      - '.github/workflows/aether-runtime-center-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/aether-runtime-center

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK from independent source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify package and launcher
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='company.taowind.aethercenter'" apk-badging.txt
          grep -q "launchable-activity: name='company.taowind.aethercenter.MainActivity'" apk-badging.txt
          unzip -p "$APK" classes.dex | strings | grep -q 'Lcompany/taowind/aethercenter/MainActivity;'
          if unzip -p "$APK" classes.dex | strings | grep -q 'company/taowind/aethermobile/bootstrap/MainActivity'; then
            echo 'Aether Mobile launcher leaked into Runtime Center APK' >&2
            exit 1
          fi

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Aether-Runtime-Center-v0.1.1-independent
          path: projects/aether-runtime-center/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
